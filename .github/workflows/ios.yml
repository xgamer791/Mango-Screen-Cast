name: iOS app

on:
  push:
    paths:
      - "ios/**"
      - "android-tv/app/src/main/cpp/**"
      - "android-tv/third_party/**"
      - ".gitmodules"
      - "tools/gen_ios_project.py"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "android-tv/app/src/main/cpp/**"
      - "android-tv/third_party/**"
      - ".gitmodules"
      - "tools/gen_ios_project.py"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

# Publishing Mango Cast Remote needs write access to the repository's contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    # One build per branch at a time, so builds reach TestFlight in order; the
    # screenshots of an earlier push never hold up the next build.
    concurrency:
      group: ios-build-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Pull requests are only built and tested; everything else goes to TestFlight.
      PUBLISH: >-
        ${{ github.event_name != 'pull_request' &&
        (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/claude/mango-screencast-app-r33dwn') }}
      # The bundle ID of the app's record in App Store Connect.
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.mangoscreencast.ios' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # App Store Connect only takes builds made with a current SDK (iOS 26 or
      # later), and the image's default Xcode is older: use the newest
      # release (not beta) Xcode installed.
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(python3 -c '
          import glob, re
          found = [([int(n) for n in m.group(1).split(".")], path) for path in glob.glob("/Applications/Xcode_*.app")
                   for m in [re.fullmatch(r"/Applications/Xcode_(\d+(?:\.\d+)*)\.app", path)] if m]
          newest = max(found, default=None)
          print(newest[1] if newest and newest[0][0] >= 26 else "")')
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 or later on this runner; App Store Connect needs the iOS 26 SDK."
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version

      - name: Xcode project matches the sources
        run: |
          python3 tools/gen_ios_project.py
          git diff --exit-code -- ios/MangoScreenCast.xcodeproj

      # Every build gets a higher build number than the one before, as
      # TestFlight requires.
      - name: Version
        run: |
          echo "MANGO_VERSION=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "MANGO_BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Unit tests (iPad simulator)
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True)
                     if "iOS" in runtime for d in ds if d["name"].startswith("iPad")))')
          xcodebuild test -project ios/MangoScreenCast.xcodeproj -scheme MangoScreenCast \
            -destination "id=$udid" -derivedDataPath build/sim > test.log 2>&1 || status=$?
          grep -E "error:|Test Case .*(passed|failed|skipped)|Executed [0-9]+ test" test.log | sort -u | head -150
          tail -n 25 test.log
          exit "${status:-0}"

      # Archived unsigned: the TestFlight upload below signs it, with a
      # certificate Apple keeps (cloud signing), so no certificate is stored here.
      - name: Archive for iPhone and iPad
        run: |
          xcodebuild archive -project ios/MangoScreenCast.xcodeproj -scheme MangoScreenCast -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/MangoScreenCast.xcarchive -derivedDataPath build/device \
            MARKETING_VERSION="$MANGO_VERSION" CURRENT_PROJECT_VERSION="$MANGO_BUILD" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build.log 2>&1 || status=$?
          grep -E "error:|warning: .*/ios/" build.log | sort -u | head -150
          tail -n 25 build.log
          [ -z "$status" ] || exit "$status"
          app=build/MangoScreenCast.xcarchive/Products/Applications/MangoScreenCast.app
          test -d "$app/Frameworks/OpenSSL.framework" || { echo "OpenSSL.framework isn't embedded"; exit 1; }
          lipo -info "$app/MangoScreenCast"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" \
            -c "Print :CFBundleVersion" "$app/Info.plist"

      # The Mac helper that plays the iPad's taps, swipes and typing on the
      # Mac. Ad-hoc signed, as no Apple ID is involved; see the README.
      - name: Build Mango Cast Remote for the Mac
        run: |
          xcodebuild build -project ios/MangoScreenCast.xcodeproj -scheme MangoCastRemote -configuration Release \
            -destination "generic/platform=macOS" -derivedDataPath build/mac \
            MARKETING_VERSION="$MANGO_VERSION" CURRENT_PROJECT_VERSION="$MANGO_BUILD" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" > mac.log 2>&1 || status=$?
          grep -E "error:|warning: .*/ios/" mac.log | sort -u | head -100
          tail -n 15 mac.log
          exit "${status:-0}"

      - name: Package Mango Cast Remote
        run: |
          mac=build/mac/Build/Products/Release/MangoCastRemote.app
          lipo -info "$mac/Contents/MacOS/MangoCastRemote"
          codesign --verify --verbose "$mac"
          mkdir -p dist
          ditto -c -k --keepParent "$mac" dist/MangoCastRemote-mac.zip
          ls -l dist

      # Signs the archive for the App Store and uploads it to App Store
      # Connect, where it shows up in TestFlight once Apple has processed it.
      # The API key needs the Admin role to create the signing certificate and
      # profile. The README says how to set these up.
      - name: Upload to TestFlight
        if: env.PUBLISH == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for pair in ASC_KEY_ID:APP_STORE_CONNECT_KEY_ID ASC_ISSUER_ID:APP_STORE_CONNECT_ISSUER_ID \
                      ASC_KEY:APP_STORE_CONNECT_KEY TEAM_ID:APPLE_TEAM_ID; do
            var=${pair%%:*}
            [ -n "${!var}" ] || missing="$missing ${pair#*:}"
          done
          if [ -n "$missing" ]; then
            echo "::error::Can't upload to TestFlight: add the repository secrets$missing (see the README, iPad and iPhone → Install)."
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # The .p8 file as is, or base64'd.
          if [[ "$ASC_KEY" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$ASC_KEY" > "$key"
          else
            printf '%s' "$ASC_KEY" | base64 -D > "$key"
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/MangoScreenCast.xcarchive -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > upload.log 2>&1 || status=$?
          rm -f "$key"
          grep -E "error|Error|warning:" upload.log | sort -u | head -60
          tail -n 40 upload.log
          [ -z "$status" ] || exit "$status"
          echo "::notice::Mango Cast $MANGO_VERSION ($MANGO_BUILD) is uploaded; it shows up in TestFlight once Apple has processed it."

      # The iPad app links to the zip here (RemoteViews.swift). A rolling
      # pre-release, so it never becomes the "latest" release the TV app
      # updates itself from. Only replaced once the iPad build is uploaded.
      - name: Publish Mango Cast Remote
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Mango Cast Remote $MANGO_VERSION for the Mac, the app that lets the iPad tap, scroll and type on the Mac it mirrors (built from ${GITHUB_SHA::7}). Mango Cast for iPad and iPhone comes through TestFlight."
          # Replace the previous build, tag included, so the tag points at this commit.
          gh release delete ios-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2> /dev/null || true
          gh release create ios-latest dist/MangoCastRemote-mac.zip --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Mango Cast Remote $MANGO_VERSION for Mac" --notes "$notes"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MangoCastRemote-mac
          path: dist/MangoCastRemote-mac.zip
          retention-days: 30

  # Screenshots of the home and Settings screens in both orientations on one
  # iPad of each screen shape (and an iPhone), to check the layout, and the
  # touch controls and keyboard tested on each (ControlsUITests).
  screenshots:
    runs-on: macos-15
    timeout-minutes: 80
    # Only the latest push's screenshots matter.
    concurrency:
      group: ios-screenshots-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Xcode the app ships with (the build job's), so the screenshots and
      # the controls tests are of the app as it is on TestFlight (Liquid Glass
      # needs the iOS 26 SDK).
      - name: Xcode
        run: |
          xcode=$(python3 -c '
          import glob, re
          found = [([int(n) for n in m.group(1).split(".")], path) for path in glob.glob("/Applications/Xcode_*.app")
                   for m in [re.fullmatch(r"/Applications/Xcode_(\d+(?:\.\d+)*)\.app", path)] if m]
          newest = max(found, default=None)
          print(newest[1] if newest and newest[0][0] >= 26 else "")')
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 or later on this runner."
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version

      - name: Build for simulators
        run: |
          xcodebuild build-for-testing -project ios/MangoScreenCast.xcodeproj -scheme Screenshots \
            -destination "generic/platform=iOS Simulator" -derivedDataPath build/ui > build.log 2>&1 || status=$?
          grep -E "error:" build.log | sort -u | head -50
          tail -n 15 build.log
          exit "${status:-0}"

      - name: Take screenshots
        run: |
          mkdir -p screenshots
          runtime=$(xcrun simctl list runtimes available --json | python3 -c '
          import json, sys
          ios = [r for r in json.load(sys.stdin)["runtimes"] if r.get("platform", r["name"]).startswith("iOS")]
          print(max(ios, key=lambda r: [int(x) for x in r["version"].split(".")])["identifier"])')
          # A 4:3 iPad (10.2-inch) too, the shape of many iPads still in use.
          xcrun simctl create "iPad (9th generation)" com.apple.CoreSimulator.SimDeviceType.iPad-9th-generation \
            "$runtime" > /dev/null 2>&1 || true
          xcrun simctl list devices available --json | RUNTIME="$runtime" python3 -c '
          import json, os, sys
          devices = {d["name"]: d["udid"] for d in json.load(sys.stdin)["devices"].get(os.environ["RUNTIME"], [])}
          # 10.2" 4:3, mini, 11" base, 11" Air, 13", and an iPhone; the newest of each.
          groups = [["iPad (9th generation)"], ["iPad mini"], ["iPad (A16)", "iPad (10th generation)"],
                    ["iPad Air 11"], ["iPad Pro 13", "iPad Air 13"], ["iPhone 17 Pro", "iPhone 16 Pro", "iPhone"]]
          for prefixes in groups:
              for prefix in prefixes:
                  names = sorted(n for n in devices if n.startswith(prefix))
                  if names:
                      print(devices[names[-1]], names[-1])
                      break' > devices.txt
          cat devices.txt
          failed=""
          while read -r udid name; do
            echo "::group::$name"
            TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots" xcodebuild test-without-building \
              -project ios/MangoScreenCast.xcodeproj -scheme Screenshots -destination "id=$udid" \
              -derivedDataPath build/ui -resultBundlePath "results/$udid.xcresult" < /dev/null > "ui-$udid.log" 2>&1 \
              || { echo "::error::UI tests failed on $name"; failed="$failed, $name"
                   grep -E "error:|Test Case .*(passed|failed)" "ui-$udid.log" | sort -u | head -40
                   tail -n 30 "ui-$udid.log"; }
            xcrun simctl shutdown "$udid" < /dev/null > /dev/null 2>&1 || true
            echo "::endgroup::"
          done < devices.txt
          ls -1 screenshots
          # The controls tests drive taps, swipes, pinches and typing; they must pass on every device.
          if [ -n "$failed" ]; then echo "UI tests failed on: ${failed#, }"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ios-screenshots
          path: screenshots/
          retention-days: 14
