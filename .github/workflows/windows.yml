name: Windows sender

on:
  push:
    paths:
      - "windows/**"
      - "protocol/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "protocol/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

# Publishing the Windows build needs write access to the repository's contents.
permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S windows -B build -A x64
          cmake --build build --config Release --parallel -- /p:CL_MPCount=4 /v:minimal

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: What the runner can do
        run: |
          $exe = "build/Release/MangoCast.exe"
          Get-Item $exe | Format-Table Name, Length
          & $exe --version | Out-Host
          & $exe --diagnose | Out-Host
          & $exe --monitors | Out-Host
