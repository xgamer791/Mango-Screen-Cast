name: Windows sender

on:
  push:
    paths:
      - "windows/**"
      - "protocol/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "protocol/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

# Publishing the Windows build needs write access to the repository's contents.
permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S windows -B build -A x64
          cmake --build build --config Release --parallel -- /v:minimal

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      # GitHub's Windows runners have no sound device; this adds a virtual one
      # (VB-Audio Virtual Cable), so the sound path gets tested too.
      - name: Virtual sound device
        continue-on-error: true
        uses: LABSN/sound-ci-helpers@v1

      - name: What the runner can do
        id: runner
        run: |
          $exe = "build/Release/MangoCast.exe"
          Get-Item $exe | Format-Table Name, Length
          & $exe --version | Out-Host
          $report = & $exe --diagnose 2> $null | Out-String
          $report | Out-Host
          & $exe --monitors | Out-Host
          $sound = if ($report -match "Sound: no playback device") { "" } else { "--sound" }
          "sound=$sound" >> $env:GITHUB_OUTPUT

      - name: Python packages
        run: python -m pip install --quiet --disable-pip-version-check av numpy zeroconf

      # Something moving on screen (and a tone playing) while the tests run.
      - name: Test pattern
        run: |
          Start-Process powershell -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'windows/tests/moving.ps1', '-Seconds', '900'
          Start-Sleep 3

      - name: End-to-end tests
        run: python windows/tests/receiver.py --exe build/Release/MangoCast.exe ${{ steps.runner.outputs.sound }} --out e2e-out

      - name: Discovery test
        run: python windows/tests/discovery_test.py --exe build/Release/MangoCast.exe

      # A rolling pre-release, never the "latest" release (the TV app updates
      # itself from releases/latest).
      - name: Publish MangoCast.exe
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/mango-screencast-app-r33dwn')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp build/Release/MangoCast.exe dist/MangoCast.exe
          notes="Mango Cast for Windows: $(git log -1 --pretty=%s) (built from ${GITHUB_SHA::7}). Unsigned: Windows may say \"Windows protected your PC\"; choose More info, then Run anyway. See windows/README.md."
          gh release delete windows-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2> /dev/null || true
          gh release create windows-latest dist/MangoCast.exe --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Mango Cast for Windows" --notes "$notes"

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: MangoCast-windows
          path: |
            build/Release/MangoCast.exe
            e2e-out/
          retention-days: 14
