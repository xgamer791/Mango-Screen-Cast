<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mango Screen Cast</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    place-items: center;
    background: #07070a;
    color: #f2f2f5;
    font: 400 16px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 32px;
  }
  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; max-width: 34ch; color: #a6a6b2; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #ff5c3d; display: inline-block; margin-right: 8px;
    vertical-align: 1px;
  }
</style>
</head>
<body>
  <main>
    <h1><span class="dot" aria-hidden="true"></span>Mango Screen Cast</h1>
    <p>Ready for the screen-share build. Nothing is published here yet.</p>
  </main>
</body>
</html>
