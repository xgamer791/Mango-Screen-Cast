<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mango Screen Cast</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 32px 24px;
    background: #07070a;
    color: #f2f2f5;
    font: 400 16px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { width: 100%; max-width: 34rem; }
  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  p {
    margin: 0 auto;
    max-width: 30rem;
    color: #a6a6b2;
    text-wrap: pretty;
    overflow-wrap: break-word;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ff5c3d;
    display: inline-block;
    margin-right: 8px;
    vertical-align: 1px;
  }
</style>
</head>
<body>
  <main>
    <h1><span class="dot" aria-hidden="true"></span>Mango Screen Cast</h1>
    <p>Ready for the screen-share build. Nothing is published here yet.</p>
  </main>
</body>
</html>
